<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <radialGradient id="propGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BFDBFE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Propeller blur rings (spinning effect) -->
  <ellipse cx="148" cy="148" rx="88" ry="20" fill="#93C5FD" opacity="0.15" transform="rotate(-35 148 148)"/>
  <ellipse cx="148" cy="148" rx="88" ry="20" fill="#93C5FD" opacity="0.12" transform="rotate(55 148 148)"/>

  <ellipse cx="364" cy="148" rx="88" ry="20" fill="#93C5FD" opacity="0.15" transform="rotate(35 364 148)"/>
  <ellipse cx="364" cy="148" rx="88" ry="20" fill="#93C5FD" opacity="0.12" transform="rotate(-55 364 148)"/>

  <ellipse cx="148" cy="364" rx="88" ry="20" fill="#93C5FD" opacity="0.15" transform="rotate(35 148 364)"/>
  <ellipse cx="148" cy="364" rx="88" ry="20" fill="#93C5FD" opacity="0.12" transform="rotate(-55 148 364)"/>

  <ellipse cx="364" cy="364" rx="88" ry="20" fill="#93C5FD" opacity="0.15" transform="rotate(-35 364 364)"/>
  <ellipse cx="364" cy="364" rx="88" ry="20" fill="#93C5FD" opacity="0.12" transform="rotate(55 364 364)"/>

  <!-- Arms -->
  <line x1="200" y1="200" x2="148" y2="148" stroke="#1D4ED8" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
  <line x1="312" y1="200" x2="364" y2="148" stroke="#1D4ED8" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
  <line x1="200" y1="312" x2="148" y2="364" stroke="#1D4ED8" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
  <line x1="312" y1="312" x2="364" y2="364" stroke="#1D4ED8" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Motor housings -->
  <circle cx="148" cy="148" r="36" fill="#1E3A8A" filter="url(#shadow)"/>
  <circle cx="364" cy="148" r="36" fill="#1E3A8A" filter="url(#shadow)"/>
  <circle cx="148" cy="364" r="36" fill="#1E3A8A" filter="url(#shadow)"/>
  <circle cx="364" cy="364" r="36" fill="#1E3A8A" filter="url(#shadow)"/>

  <!-- Propellers (2 blades each) -->
  <!-- Top-left -->
  <ellipse cx="148" cy="148" rx="70" ry="14" fill="url(#propGrad)" opacity="0.85" transform="rotate(-30 148 148)"/>
  <ellipse cx="148" cy="148" rx="70" ry="14" fill="url(#propGrad)" opacity="0.85" transform="rotate(60 148 148)"/>
  <!-- Top-right -->
  <ellipse cx="364" cy="148" rx="70" ry="14" fill="url(#propGrad)" opacity="0.85" transform="rotate(30 364 148)"/>
  <ellipse cx="364" cy="148" rx="70" ry="14" fill="url(#propGrad)" opacity="0.85" transform="rotate(-60 364 148)"/>
  <!-- Bottom-left -->
  <ellipse cx="148" cy="364" rx="70" ry="14" fill="url(#propGrad)" opacity="0.85" transform="rotate(30 148 364)"/>
  <ellipse cx="148" cy="364" rx="70" ry="14" fill="url(#propGrad)" opacity="0.85" transform="rotate(-60 148 364)"/>
  <!-- Bottom-right -->
  <ellipse cx="364" cy="364" rx="70" ry="14" fill="url(#propGrad)" opacity="0.85" transform="rotate(-30 364 364)"/>
  <ellipse cx="364" cy="364" rx="70" ry="14" fill="url(#propGrad)" opacity="0.85" transform="rotate(60 364 364)"/>

  <!-- Motor center dots -->
  <circle cx="148" cy="148" r="10" fill="#93C5FD"/>
  <circle cx="364" cy="148" r="10" fill="#93C5FD"/>
  <circle cx="148" cy="364" r="10" fill="#93C5FD"/>
  <circle cx="364" cy="364" r="10" fill="#93C5FD"/>

  <!-- Main body -->
  <rect x="186" y="186" width="140" height="140" rx="28" ry="28" fill="#1E40AF" filter="url(#shadow)"/>

  <!-- Body detail lines -->
  <line x1="256" y1="194" x2="256" y2="318" stroke="#3B82F6" stroke-width="3" opacity="0.4"/>
  <line x1="194" y1="256" x2="318" y2="256" stroke="#3B82F6" stroke-width="3" opacity="0.4"/>

  <!-- Camera mount -->
  <circle cx="256" cy="256" r="30" fill="#0F172A"/>
  <circle cx="256" cy="256" r="22" fill="#1E3A8A"/>
  <circle cx="256" cy="256" r="14" fill="#BFDBFE"/>
  <circle cx="256" cy="256" r="8" fill="#DBEAFE" opacity="0.9"/>
  <circle cx="250" cy="250" r="3" fill="white" opacity="0.7"/>

  <!-- LED lights -->
  <circle cx="198" cy="198" r="5" fill="#EF4444" opacity="0.9" filter="url(#glow)"/>
  <circle cx="314" cy="198" r="5" fill="#EF4444" opacity="0.9" filter="url(#glow)"/>
  <circle cx="198" cy="314" r="5" fill="#22C55E" opacity="0.9" filter="url(#glow)"/>
  <circle cx="314" cy="314" r="5" fill="#22C55E" opacity="0.9" filter="url(#glow)"/>
</svg>